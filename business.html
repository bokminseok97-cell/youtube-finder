<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>협업할 유튜버 찾기 | 유튜브 파인더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back">← 처음으로</a>
    <h1>🤝 협업할 유튜버 찾기</h1>
    <p>브랜드와 잘 맞는 크리에이터를 찾아보세요.</p>
  </header>

  <main class="channel-list">

    <article class="channel">
      <div class="channel-top">
        <div class="avatar">헬</div>
        <div>
          <h2>헬시라이프TV</h2>
          <span class="tag">건강·운동</span>
        </div>
      </div>
      <ul class="stats">
        <li><strong>25만</strong><span>구독자</span></li>
        <li><strong>8.2만</strong><span>평균 조회수</span></li>
        <li><strong>4.1%</strong><span>참여율</span></li>
      </ul>
      <p class="desc">40~50대 대상 홈트레이닝·식단 콘텐츠</p>
    </article>

    <article class="channel">
      <div class="channel-top">
        <div class="avatar">맛</div>
        <div>
          <h2>맛있는하루</h2>
          <span class="tag">요리·리뷰</span>
        </div>
      </div>
      <ul class="stats">
        <li><strong>12만</strong><span>구독자</span></li>
        <li><strong>3.5만</strong><span>평균 조회수</span></li>
        <li><strong>5.3%</strong><span>참여율</span></li>
      </ul>
      <p class="desc">간편 건강식 레시피와 식품 솔직 리뷰</p>
    </article>

    <article class="channel">
      <div class="channel-top">
        <div class="avatar">시</div>
        <div>
          <h2>시니어로그</h2>
          <span class="tag">일상·브이로그</span>
        </div>
      </div>
      <ul class="stats">
        <li><strong>6.8만</strong><span>구독자</span></li>
        <li><strong>2.1만</strong><span>평균 조회수</span></li>
        <li><strong>6.0%</strong><span>참여율</span></li>
      </ul>
      <p class="desc">60대 부부의 건강한 일상 브이로그</p>
    </article>

  </main>

  <footer>
    <p>© 2026 유튜브 파인더</p>
  </footer>

</body>
</html>
