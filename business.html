<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>협업할 유튜버 찾기 | 유튜브 파인더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back">← 처음으로</a>
    <h1>🤝 협업할 유튜버 찾기</h1>
    <p>브랜드와 잘 맞는 크리에이터를 찾아보세요. 구독자 규모와 평균 조회수로 비교할 수 있어요.</p>
  </header>

  <section class="search-area">
    <form id="search-form" class="search-form">
      <input type="text" id="search" class="search-input" placeholder="예: 다이어트, 건강식품 리뷰, 홈트레이닝">
      <button type="submit" class="search-btn">검색</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-size="all">전체</button>
        <button class="filter-btn" data-size="micro">1만 미만</button>
        <button class="filter-btn" data-size="small">1만~10만</button>
        <button class="filter-btn" data-size="mid">10만~100만</button>
        <button class="filter-btn" data-size="big">100만 이상</button>
      </div>
      <select id="sort" class="sort-select">
        <option value="relevance">관련도순</option>
        <option value="subscribers">구독자 많은 순</option>
        <option value="avgViews">평균 조회수 높은 순</option>
      </select>
    </div>

    <p id="count" class="result-count"></p>
    <p id="status" class="status">검색어를 입력하고 Enter를 눌러보세요.</p>
  </section>

  <main id="channel-list" class="channel-list"></main>

  <footer>
    <p>© 2026 유튜브 파인더</p>
  </footer>

  <script src="config.js"></script>
  <script src="business.js"></script>

</body>
</html>
