<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>볼 게 없을 때 | 유튜브 파인더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back">← 처음으로</a>
    <h1>🍿 볼 게 없을 때</h1>
    <p>지금 기분을 고르거나, 그냥 아무거나 추천받아 보세요. 구독자 1만 명 이상 채널만 보여드려요.</p>
  </header>

  <section class="search-area">
    <form id="search-form" class="search-form">
      <input type="text" id="search" class="search-input" placeholder="보고 싶은 게 있으면 직접 검색해도 돼요">
      <button type="submit" class="search-btn">검색</button>
    </form>

    <div class="mood-row">
      <span class="row-label">기분으로 고르기</span>
      <div class="filters">
        <button class="filter-btn mood-btn" data-mood="laugh">😂 웃고 싶을 때</button>
        <button class="filter-btn mood-btn" data-mood="healing">🌿 힐링하고 싶을 때</button>
        <button class="filter-btn mood-btn" data-mood="focus">🔍 몰입하고 싶을 때</button>
        <button class="filter-btn mood-btn" data-mood="learn">💡 뭔가 알고 싶을 때</button>
        <button class="filter-btn mood-btn" data-mood="vlog">📹 브이로그</button>
        <button class="filter-btn mood-btn" data-mood="celeb">⭐ 연예인</button>
        <button id="random-btn" class="filter-btn random-chip">🎲 아무거나</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn size-btn active" data-size="all">전체 (1만 이상)</button>
        <button class="filter-btn size-btn" data-size="small">1만~10만</button>
        <button class="filter-btn size-btn" data-size="mid">10만~100만</button>
        <button class="filter-btn size-btn" data-size="big">100만 이상</button>
      </div>
      <select id="sort" class="sort-select">
        <option value="random">섞어서 보기</option>
        <option value="subscribers">구독자 많은 순</option>
        <option value="avgViews">평균 조회수 높은 순</option>
      </select>
    </div>

    <div class="result-bar">
      <p id="count" class="result-count"></p>
      <button class="reroll-btn" hidden>🔄 다른 채널 보기</button>
    </div>
    <p id="status" class="status">기분 버튼이나 🎲 버튼을 눌러보세요.</p>
  </section>

  <main id="channel-list" class="channel-list"></main>

  <div class="reroll-bottom">
    <button class="reroll-btn" hidden>🔄 마음에 안 들어요, 다른 채널 보기</button>
  </div>

  <footer>
    <p>© 2026 유튜브 파인더</p>
  </footer>

  <script>
    window.PAGE = {
      moods: {
        laugh: ['웃긴 동물', '코미디 스케치', '몰래카메라', '웹드라마'],
        healing: ['캠핑 브이로그', '자연 ASMR', '시골 일상', '요리 브이로그'],
        focus: ['세계 미스터리', '다큐멘터리', '역사 이야기', '여행 다큐'],
        learn: ['과학 실험', '우주 이야기', '경제 상식', '심리학 이야기'],
        vlog: ['일상 브이로그', '직장인 브이로그', '자취 브이로그', '해외 생활 브이로그', '커플 브이로그'],
        celeb: ['연예인 브이로그', '아이돌 자체 콘텐츠', '배우 유튜브', '개그맨 유튜브', '웹예능']
      }
    };
  </script>
  <script src="config.js"></script>
  <script src="finder.js"></script>

</body>
</html>
