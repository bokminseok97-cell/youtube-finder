<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공부할 유튜버 찾기 | 유튜브 파인더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back">← 처음으로</a>
    <h1>📚 공부할 유튜버 찾기</h1>
    <p>배우고 싶은 분야를 검색하면 유튜브에서 강의 채널을 찾아드려요.</p>
  </header>

  <section class="search-area">
    <form id="search-form" class="search-form">
      <input type="text" id="search" class="search-input" placeholder="예: 엑셀, 영어 회화, 파이썬">
      <button type="submit" class="search-btn">검색</button>
    </form>
    <p id="status" class="status">검색어를 입력하고 Enter를 눌러보세요.</p>
  </section>

  <main id="channel-list" class="channel-list"></main>

  <footer>
    <p>© 2026 유튜브 파인더</p>
  </footer>

  <script src="config.js"></script>
  <script src="youtube.js"></script>

</body>
</html>
